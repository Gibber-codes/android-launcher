name: Build APK

on:
  push:
    branches: [main]
    # Gibber Phone has its own workflow (build-phone.yml).
    paths-ignore:
      - "phone/**"
      - ".github/workflows/build-phone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # The launcher's one signing key. It lives in signing/, locked with the LAUNCHER_KEY_PASSWORD
      # secret; the first build after that secret is added makes the key and saves it here.
      - name: Signing key
        id: key
        env:
          PW: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning::No LAUNCHER_KEY_PASSWORD secret yet, so this build uses a throwaway key and isn't published as a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f signing/launcher.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/launcher.p12 -storetype PKCS12 -alias launcher \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Gibber Launcher"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/launcher.p12
            git commit -m "Save the launcher's signing key, locked with the repo secret [skip ci]"
            git push
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          LAUNCHER_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/signing/launcher.p12', github.workspace) || '' }}
          LAUNCHER_KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          if [ -z "$LAUNCHER_KEYSTORE" ]; then unset LAUNCHER_KEYSTORE; fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk gibber-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gibber-launcher-apk
          path: gibber-launcher.apk

      # One plain APK per build on the repo's Releases, which the launcher's Update button reads.
      - name: Publish the release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" gibber-launcher.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "${NOTES:-Built by hand from main.}" \
            --latest
